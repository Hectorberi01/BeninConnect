- name: Dossiers de l'application
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}"

# Sauvegardes : écrites par les conteneurs backup (root) et par l'API (utilisateur app, uid/gid 1654).
# Groupe 1654 + setgid : l'API lit tout et gère manual/ ; les autres comptes n'y ont pas accès.
- name: Dossiers des sauvegardes
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ api_container_gid }}"
    mode: "2770"
  loop:
    - "{{ app_dir }}/server/backups"
    - "{{ app_dir }}/server/backups/daily"
    - "{{ app_dir }}/server/backups/weekly"
    - "{{ app_dir }}/server/backups/monthly"
    - "{{ app_dir }}/server/backups/last"
    - "{{ app_dir }}/server/backups/media"
    - "{{ app_dir }}/server/backups/manual"

- name: Mode de déploiement
  ansible.builtin.set_fact:
    app_from_registry: "{{ app_image_tag | length > 0 }}"

# Seulement ce que les Dockerfile utilisent (pas de mobile, de tests ni de secrets locaux).
- name: Fichiers racine du dépôt
  when: not app_from_registry
  ansible.builtin.copy:
    src: "{{ repo_root }}/{{ item }}"
    dest: "{{ app_dir }}/{{ item }}"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
  loop: [global.json, Directory.Build.props, Directory.Packages.props, .dockerignore]

# Images de la CI : seuls docker-compose.prod.yml et le .env servent sur le serveur.
- name: Fichier compose
  when: app_from_registry
  ansible.builtin.copy:
    src: "{{ repo_root }}/server/docker-compose.prod.yml"
    dest: "{{ app_dir }}/server/docker-compose.prod.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Code du backend
  when: not app_from_registry
  ansible.posix.synchronize:
    src: "{{ repo_root }}/server/"
    dest: "{{ app_dir }}/server/"
    delete: true
    rsync_opts:
      - "--exclude=bin/"
      - "--exclude=obj/"
      - "--exclude=tests/"
      - "--exclude=media/"
      - "--exclude=backups/"
      - "--exclude=.env"
      - "--exclude=.env.deploy"
      - "--exclude=Directory.Build.targets"
  notify: Reconstruire

# Propriétaire seulement : le groupe des sauvegardes (api_container_gid) est conservé.
- name: Propriétaire des fichiers copiés
  ansible.builtin.file:
    path: "{{ app_dir }}"
    owner: "{{ deploy_user }}"
    recurse: true

# Le .env (secrets) est déposé à la main sur le serveur avant le premier déploiement : Ansible ne le crée jamais.
- name: Vérifier la présence du .env
  ansible.builtin.stat:
    path: "{{ app_dir }}/server/.env"
  register: env_file

- name: Arrêter si le .env manque
  ansible.builtin.assert:
    that: env_file.stat.exists
    fail_msg: >-
      {{ app_dir }}/server/.env introuvable sur le serveur. Le créer à partir de server/.env.example
      (scp server/.env.example puis édition), droits 600, avant de relancer le déploiement.
    quiet: true

- name: Droits du .env (lecture par le seul utilisateur de déploiement)
  ansible.builtin.file:
    path: "{{ app_dir }}/server/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0600"

# Version à déployer (non secret), séparée du .env pour ne jamais toucher aux secrets.
- name: Version de l'API (.env.deploy)
  ansible.builtin.copy:
    dest: "{{ app_dir }}/server/.env.deploy"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"
    content: |
      # Version de l'API à déployer (écrit par le déploiement et par rollback.sh ; vide = image construite sur le serveur)
      {% if app_from_registry %}
      APP_VERSION={{ app_image_tag }}
      API_REGISTRY={{ app_image_registry | lower }}
      {% endif %}

- name: Appliquer les reconstructions en attente
  ansible.builtin.meta: flush_handlers

- name: Connexion au registre d'images
  when: app_from_registry and registry_token | length > 0
  community.docker.docker_login:
    registry_url: "{{ app_image_registry.split('/')[0] }}"
    username: "{{ registry_user }}"
    password: "{{ registry_token }}"
  no_log: true

- name: Conteneurs démarrés
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}/server"
    files: [docker-compose.prod.yml]
    env_files: [.env, .env.deploy]
    state: present
    remove_orphans: true
    pull: "{{ 'always' if app_from_registry else 'missing' }}"
    build: "{{ 'never' if app_from_registry else 'policy' }}"

# Le jeton de la CI expire à la fin du job : inutile de le garder sur le serveur.
- name: Déconnexion du registre
  when: app_from_registry and registry_token | length > 0
  community.docker.docker_login:
    registry_url: "{{ app_image_registry.split('/')[0] }}"
    state: absent

# Directement sur le port local (Caddy n'intervient pas) : vérifie l'API et sa base.
- name: Santé de l'API
  block:
    - name: Attendre que l'API réponde
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ api_port }}/health"
        status_code: 200
      register: health
      until: health.status == 200
      retries: "{{ health_retries }}"
      delay: 10
  rescue:
    # API qui redémarre en boucle : la cause est dans ses journaux (configuration refusée, base injoignable...).
    - name: Journaux de l'API
      ansible.builtin.command:
        cmd: docker compose --env-file .env --env-file .env.deploy -f docker-compose.prod.yml logs --no-color --tail 60 api
        chdir: "{{ app_dir }}/server"
      register: api_logs
      changed_when: false
      failed_when: false

    - name: Échec du déploiement
      ansible.builtin.fail:
        msg: "L'API ne répond pas sur /health. Dernières lignes :\n{{ api_logs.stdout_lines[-40:] | join('\n') }}"

# Historique des déploiements : sert au retour arrière (Deploy « previous », ./rollback.sh)
- name: Version qui tourne
  when: app_from_registry
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ api_port }}/"
    return_content: true
  register: api_root

- name: Dernière version de l'historique
  when: app_from_registry
  ansible.builtin.shell: |
    set -o pipefail
    if [ -f "$HISTORY" ]; then tail -n 1 "$HISTORY" | cut -f2; fi
  args:
    executable: /bin/bash
  environment:
    HISTORY: "{{ app_dir }}/server/deploy-history.log"
  register: last_deployed
  changed_when: false

# Même version redéployée : pas de nouvelle ligne (sinon « previous » reviendrait sur elle-même)
- name: Ajouter le déploiement à l'historique
  when: app_from_registry and last_deployed.stdout != app_image_tag
  ansible.builtin.lineinfile:
    path: "{{ app_dir }}/server/deploy-history.log"
    line: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}\t{{ app_image_tag }}\t{{ api_root.json.version | default('?') }}"
    insertafter: EOF
    create: true
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0644"

- name: Script de retour arrière
  ansible.builtin.template:
    src: rollback.sh.j2
    dest: "{{ app_dir }}/server/rollback.sh"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

# Les plus récentes d'abord ; une image utilisée par un conteneur n'est jamais supprimée
- name: Garder les dernières images de l'API
  when: app_from_registry
  ansible.builtin.shell: |
    set -o pipefail
    {% raw %}docker images "$REPO" --format '{{.Repository}}:{{.Tag}}'{% endraw %} \
      | grep -v -e ':<none>$' -e ':latest$' | tail -n +$(( KEEP + 1 )) | xargs -r docker rmi > /dev/null 2>&1 || true
  args:
    executable: /bin/bash
  environment:
    REPO: "{{ app_image_registry | lower }}/beninconnect-api"
    KEEP: "{{ keep_images }}"
  changed_when: false

- name: Supprimer les images inutilisées
  community.docker.docker_prune:
    images: true
    images_filters:
      dangling: true
