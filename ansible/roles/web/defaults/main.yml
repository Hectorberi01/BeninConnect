# Site public servi par Caddy (installé sur le VPS)
web_root: /var/www/monbenin
caddy_site_file: /etc/caddy/sites/beninconnect.caddy
# API de revue (review-api.monbenin.com) : bloc Caddy séparé, présent seulement si review_enabled
caddy_review_file: /etc/caddy/sites/beninconnect-review.caddy
review_enabled: false
# Console d'administration : build Vite fait par la CI (npm run build) avant Ansible
admin_root: /var/www/admin
admin_dist: "{{ repo_root }}/admin-console/dist"
