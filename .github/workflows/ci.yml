# Intégration continue : tests de chaque partie, puis images Docker publiées sur GHCR
# (branche main : sha-1a2b3c4 + latest ; tag Git v1.2.0 : 1.2.0 + 1.2).
name: CI

# Application Avalonia hors CI : ses projets et ses tests ne déclenchent rien.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "src/BeninConnect.Desktop/**"
      - "src/BeninConnect.Android/**"
      - "src/BeninConnect.iOS/**"
      - "tests/**"
      - "BeninConnect.sln"
  pull_request:
    paths-ignore:
      - "src/BeninConnect.Desktop/**"
      - "src/BeninConnect.Android/**"
      - "src/BeninConnect.iOS/**"
      - "tests/**"
      - "BeninConnect.sln"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Restauration
        run: dotnet restore server/BeninConnect.Server.sln
      - name: Build
        run: dotnet build server/BeninConnect.Server.sln --no-restore -c Release
      # Testcontainers : PostgreSQL et MinIO éphémères (Docker est disponible sur les runners Ubuntu)
      - name: Tests (intégration, architecture, migrations)
        run: >-
          dotnet test server/tests/BeninConnect.Api.Tests --no-build -c Release
          --logger "trx;LogFileName=backend.trx" --results-directory TestResults
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-tests
          path: TestResults

  admin-console:
    name: Console admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  mobile:
    name: Application mobile (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-expo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci

  ansible:
    name: Ansible (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: ansible-galaxy collection install -r requirements.yml -p collections
      - run: ansible-playbook site.yml deploy.yml --syntax-check
      - run: ansible-lint site.yml deploy.yml

  site:
    name: Site public et Caddy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation du Caddyfile
        run: >-
          docker run --rm -v "$PWD/server/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          sh -c "mkdir -p /var/log/caddy && caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile"
      - name: Pages et liens internes
        run: |
          test -f site/index.html && test -f site/404.html
          # Chaque lien interne (/chemin/) doit correspondre à une page du dossier site/
          missing=0
          for link in $(grep -rhoE 'href="/[^"#?]*"' site --include=*.html | sed -E 's/href="([^"]*)"/\1/' | sort -u); do
            target="site${link}"
            [ -f "$target" ] || [ -f "${target%/}/index.html" ] || [ -f "${target}index.html" ] || { echo "::error::Lien cassé : $link"; missing=1; }
          done
          exit $missing

  images:
    name: Images Docker (GHCR)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, admin-console]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: server/src/BeninConnect.Api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/beninconnect-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      # Version lue par l'API (racine / et console) : 1.2.0 sur un tag, sha-1a2b3c4 sinon
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="sha-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Version de l'image : \`$v\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
