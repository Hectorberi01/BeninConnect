# Mise à jour à chaud de l'app mobile (EAS Update) : JavaScript et images seulement, sans passer par les stores.
# Manuel : Actions > Mobile update > Run workflow. Reçue par les apps dont la version (app.json) est identique.
# Changement natif (module, permission, icône, version) : nouveau build EAS et publication sur les stores.
# Secret requis : EXPO_TOKEN (expo.dev > Account settings > Access tokens).
name: Mobile update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal : production (stores) ou preview (builds internes)"
        type: choice
        options: [production, preview]
        default: production
      message:
        description: "Description de la mise à jour (visible sur expo.dev)"
        required: true

concurrency:
  group: mobile-update-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-expo/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Publication EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ inputs.message }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          npx --yes eas-cli@latest update --channel "$CHANNEL" --environment "$CHANNEL" --message "$MESSAGE" --non-interactive
          echo "### Mise à jour publiée sur \`$CHANNEL\` (version $(node -p "require('./app.json').expo.version"))" >> "$GITHUB_STEP_SUMMARY"
