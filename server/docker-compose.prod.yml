# Production : API (qui sauvegarde aussi la base) + sauvegarde des photos. HTTPS assuré par Caddy installé sur le VPS (voir server/Caddyfile).
# La base PostgreSQL est hébergée ailleurs : voir DB_* dans .env.
#   cp .env.example .env   # puis remplir les secrets
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
name: beninconnect-prod

services:
  api:
    # Image de la CI (GHCR) si API_IMAGE est défini, sinon construite sur le serveur.
    image: ${API_IMAGE:-beninconnect-api:local}
    build:
      context: ..
      dockerfile: server/src/BeninConnect.Api/Dockerfile
    restart: unless-stopped
    # Joignable seulement depuis le VPS : Caddy fait le reverse proxy vers 127.0.0.1:8080.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    # PostgreSQL installé sur le VPS lui-même : DB_HOST=host.docker.internal (localhost = le conteneur).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # true seulement pour une base sur le VPS ou un réseau privé (WireGuard) sans SSL
      Database__AllowInsecure: ${DB_ALLOW_INSECURE:-false}
      ConnectionStrings__Database: "Host=${DB_HOST};Port=${DB_PORT:-5432};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};SSL Mode=${DB_SSLMODE:-Require};Maximum Pool Size=${DB_POOL_SIZE:-20};Timeout=15;Keepalive=30;GSS Encryption Mode=Disable"
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Emails (codes de vérification, mot de passe oublié) : Resend par défaut, SMTP possible
      Email__Provider: ${EMAIL_PROVIDER:-resend}
      Email__ResendApiKey: ${RESEND_API_KEY:-}
      Email__From: ${EMAIL_FROM}
      Email__FromName: ${EMAIL_FROM_NAME:-BéninConnect}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__Username: ${SMTP_USERNAME:-}
      Email__Password: ${SMTP_PASSWORD:-}
      Admin__BootstrapEmail: ${ADMIN_BOOTSTRAP_EMAIL}
      Admin__BootstrapPassword: ${ADMIN_BOOTSTRAP_PASSWORD}
      # Origines web autorisées (navigateur) : app Expo web en test, future console admin. Inutile pour l'app mobile.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-}
      # Notifications push via Expo ; jeton seulement si « Enhanced Security » est activé dans le projet Expo
      Push__ExpoAccessToken: ${EXPO_ACCESS_TOKEN:-}
      # Photos, vidéos et pièces jointes : disque (volume media) par défaut ; S3 (R2, Hetzner, MinIO...) avec MEDIA_PROVIDER=s3 et S3_* dans .env
      Media__Provider: ${MEDIA_PROVIDER:-local}
      Media__S3__ServiceUrl: ${S3_SERVICE_URL:-}
      Media__S3__Region: ${S3_REGION:-auto}
      Media__S3__Bucket: ${S3_BUCKET:-beninconnect-media}
      Media__S3__AccessKey: ${S3_ACCESS_KEY:-}
      Media__S3__SecretKey: ${S3_SECRET_KEY:-}
      Media__S3__PublicBaseUrl: ${S3_PUBLIC_BASE_URL:-}
      Media__S3__CreateBucket: ${S3_CREATE_BUCKET:-false}
      Media__S3__PrivateBucket: ${S3_PRIVATE_BUCKET:-}
      # Sauvegardes de la base faites par l'API (pg_dump dans l'image) : chaque jour à 01:00 UTC dans backups/daily,
      # copies weekly/monthly, conservation 7 jours / 4 semaines / 6 mois ; liste et sauvegarde immédiate dans la console
      # Ouverture des liens https://monbenin.com/post/… dans l'app installée (fichiers /.well-known) ; vide = page web seulement
      AppLinks__AppleTeamId: ${APPLE_TEAM_ID:-}
      AppLinks__AndroidCertSha256: ${ANDROID_CERT_SHA256:-}
      Backups__Directory: /backups
      Backups__DailyAtUtc: ${BACKUP_DAILY_AT_UTC:-01:00}
      # Copie hors du serveur (S3 / R2) : activée si S3_BACKUP_BUCKET est défini ; mêmes identifiants que les médias
      Backups__Offsite__Bucket: ${S3_BACKUP_BUCKET:-}
      Backups__Offsite__ServiceUrl: ${S3_SERVICE_URL:-}
      Backups__Offsite__Region: ${S3_REGION:-auto}
      Backups__Offsite__AccessKey: ${S3_ACCESS_KEY:-}
      Backups__Offsite__SecretKey: ${S3_SECRET_KEY:-}
      Backups__Offsite__RetentionDays: ${BACKUP_OFFSITE_RETENTION_DAYS:-90}
    volumes:
      - media:/app/media
      - ./backups:/backups

  # Copie quotidienne des photos (volume media) dans ./backups/media, 7 jours conservés.
  media-backup:
    image: offen/docker-volume-backup:v2
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 3 * * *"
      BACKUP_FILENAME: photos-%Y-%m-%d.tar.gz
      BACKUP_RETENTION_DAYS: "7"
    volumes:
      - media:/backup/media:ro
      - ./backups/media:/archive

volumes:
  media:
